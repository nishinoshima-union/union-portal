function loadData(key,fallback){try{const r=localStorage.getItem(key);return r?JSON.parse(r):fallback;}catch{return fallback;}}
function saveData(key,data){

const FIREBASE_CONFIG={"apiKey":"AIzaSyBubnqn_m5jAnfoCHlLyckZNfPrMSzbeTs","authDomain":"nishinoshima-town.firebaseapp.com","projectId":"nishinoshima-town","storageBucket":"nishinoshima-town.firebasestorage.app"}; // 例: {apiKey:"...",authDomain:"...",projectId:"..."}

function getFbConfig(){
  if(FIREBASE_CONFIG)return FIREBASE_CONFIG;
  try{return JSON.parse(localStorage.getItem('fb_config')||'null');}catch{return null;}
}
const BAKED_MEMBERS=null; // 組合員リスト（管理者・氏名・所属）- ダウンロード時に自動埋め込み
function getMembers(fallback){
  if(BAKED_MEMBERS&&BAKED_MEMBERS.length>0)return BAKED_MEMBERS;
  try{const r=localStorage.getItem('union_members');return r?JSON.parse(r):fallback;}catch{return fallback;}
}
function initFb(){
  const cfg=getFbConfig();if(!cfg)return null;
  if(typeof firebase==='undefined')throw new Error('Firebase SDK not loaded');
  if(!firebase.apps.length)firebase.initializeApp(cfg);
  return firebase.auth();
}
function getStorage(){
  const cfg=getFbConfig();
  if(!cfg||typeof firebase==='undefined')return null;
  try{if(!firebase.apps.length)firebase.initializeApp(cfg);return firebase.storage();}catch(e){return null;}
}
function getFs(){
  const cfg=getFbConfig();
  if(!cfg||typeof firebase==='undefined')return null;
  try{if(!firebase.apps.length)firebase.initializeApp(cfg);return firebase.firestore();}catch(e){return null;}
}
async function uploadFile(file,path,onProgress){
  const storage=getStorage();
  if(!storage)throw new Error('Firebase Storage が設定されていません');
  const ref=storage.ref(path+'/'+Date.now()+'_'+file.name);
  const task=ref.put(file);
  return new Promise((resolve,reject)=>{
    task.on('state_changed',
      snap=>onProgress&&onProgress(Math.round(snap.bytesTransferred/snap.totalBytes*100)),
      reject,
      async()=>resolve({url:await task.snapshot.ref.getDownloadURL(),name:file.name,size:formatSize(file.size),type:getFileType(file)})
    );
  });
}
function formatSize(bytes){if(bytes<1024)return bytes+'B';if(bytes<1024*1024)return Math.round(bytes/1024)+'KB';return(bytes/1024/1024).toFixed(1)+'MB';}
function getFileType(file){const t=file.type;if(t.startsWith('image/'))return 'image';if(t==='application/pdf')return 'pdf';return 'link';}

function getEjsCfg(){return{publicKey:localStorage.getItem('ejs_pubkey')||'',serviceId:localStorage.getItem('ejs_service')||'',templateId:localStorage.getItem('ejs_template')||'',adminEmail:localStorage.getItem('ejs_admin_email')||'',allEmail:localStorage.getItem('ejs_all_email')||''}}
function notifOn(key){return localStorage.getItem('notif_'+key)!=='false'}
async function sendMail({to,subject,body,senderName,type}){
  const cfg=getEjsCfg();
  if(!cfg.publicKey||!cfg.serviceId||!cfg.templateId||!to){console.info('[mail] skipped:',subject);return{skipped:true}}
  emailjs.init({publicKey:cfg.publicKey});
  return emailjs.send(cfg.serviceId,cfg.templateId,{to_email:to,subject,body,sender_name:senderName||'西ノ島町職員組合',notify_type:type||'',app_url:window.location.href});
}

const LoginScreen = ({onLogin}) => {
  const [mode,setMode]=useState('login');
  const [email,setEmail]=useState(()=>localStorage.getItem('saved_email')||'');
  const [pw,setPw]=useState(()=>localStorage.getItem('saved_pw')||'');
  const [pw2,setPw2]=useState('');
  const [name,setName]=useState('');
  const [dept,setDept]=useState('');
  const [rememberMe,setRememberMe]=useState(()=>!!localStorage.getItem('saved_email'));
  const [showPw,setShowPw]=useState(false);
  const [err,setErr]=useState('');
  const [loading,setLoading]=useState(false);
  const [done,setDone]=useState(false);
  const [hasFbConfig]=useState(()=>!!getFbConfig());
  const ACCOUNTS=[
    {email:'admin@union.jp',password:'admin123',name:'田中 一郎',dept:'執行部（組合委員長）',role:'admin'},
    {email:'member@union.jp',password:'member123',name:'山本 花子',dept:'住民課',role:'member'},
  ];
  const handleLogin=async()=>{
    setErr('');setLoading(true);
    let fbAuth=null;
    try{fbAuth=initFb();}catch(e){fbAuth=null;}
    if(fbAuth){
      try{
        await fbAuth.signInWithEmailAndPassword(email,pw);
        // まずローカルのメンバーリストで検索
        let mems=getMembers(SAMPLE_MEMBERS);
        let profile=mems.find(m=>m.email===email);
        // ローカルになければFirestoreから直接取得
        if(!profile){
          try{
            const fs=getFs();
            if(fs){
              const snap=await fs.collection('union').doc('union_members').get();
              if(snap.exists&&snap.data().d){
                mems=snap.data().d;
                profile=mems.find(m=>m.email===email);
                if(mems.length>0)localStorage.setItem('union_members',JSON.stringify(mems));
              }
            }
          }catch(e){}
        }
        if(rememberMe){localStorage.setItem('saved_email',email);localStorage.setItem('saved_pw',pw);}
        else{localStorage.removeItem('saved_email');localStorage.removeItem('saved_pw');}
        onLogin({email,name:(profile&&profile.name)||email.split('@')[0],dept:(profile&&profile.dept)||'',role:(profile&&profile.role)||'member'});
      }catch(e){
        const code=(e&&e.code)||'';
        if(code==='auth/user-not-found'||code==='auth/wrong-password'||code==='auth/invalid-credential')setErr('メールアドレスまたはパスワードが正しくありません');
        else if(code==='auth/unauthorized-domain')setErr('このドメインはFirebaseに未登録です。FirebaseコンソールのAuthenticationで承認済みドメインに追加してください');
        else setErr('ログインエラー: '+(code||(e&&e.message)||'不明'));
      }
      setLoading(false);return;
    }
    const found=ACCOUNTS.find(a=>a.email===email&&a.password===pw);
    if(!found){setErr('メールアドレスまたはパスワードが正しくありません');setLoading(false);return;}
    if(rememberMe){localStorage.setItem('saved_email',email);localStorage.setItem('saved_pw',pw);}
    else{localStorage.removeItem('saved_email');localStorage.removeItem('saved_pw');}
    setLoading(false);onLogin(found);
  };
  const handleRegister=async()=>{
    setErr('');
    if(!name||!dept||!email||!pw)return setErr('すべての項目を入力してください');
    if(pw!==pw2)return setErr('パスワードが一致しません');
    if(pw.length<6)return setErr('パスワードは6文字以上にしてください');
    let fbAuth=null;
    try{fbAuth=initFb();}catch(e){fbAuth=null;}
    if(!fbAuth)return setErr('新規登録にはFirebase設定が必要です。管理者にお問い合わせください。');
    setLoading(true);
    try{
      await fbAuth.createUserWithEmailAndPassword(email,pw);
      const newMember={id:Date.now(),name,dept,email,role:'member',joinDate:new Date().toISOString().slice(0,10)};
      const mems=loadData('union_members',SAMPLE_MEMBERS);
      saveData('union_members',[...mems,newMember]);
      setDone(true);
      setTimeout(()=>{onLogin({email,name,dept,role:'member'});},1500);
    }catch(e){
      const code=(e&&e.code)||'';
      if(code==='auth/email-already-in-use')setErr('このメールアドレスはすでに登録されています');
      else setErr('登録エラー: '+(code||(e&&e.message)||'不明'));
    }
    setLoading(false);
  };
  if(done)return(
    <div className="min-h-screen bg-gradient-to-b from-blue-700 to-blue-900 flex flex-col items-center justify-center p-6">
      <div className="bg-white rounded-2xl p-8 w-full max-w-sm shadow-xl text-center">
        <div className="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4"><Icon name="check" size={32} color="#16a34a"/></div>
        <p className="text-lg font-bold text-gray-900 mb-1">登録完了！</p>
        <p className="text-sm text-gray-500">ログインしています...</p>
      </div>
    </div>
  );
  return (
    <div className="min-h-screen bg-gradient-to-b from-blue-700 to-blue-900 flex flex-col items-center justify-center p-6">
      <div className="mb-8 text-center">
        <div className="w-16 h-16 bg-white rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg"><Icon name="shield" size={32} color="#1d4ed8"/></div>
        <h1 className="text-white text-xl font-bold">西ノ島町職員組合</h1>
        <p className="text-blue-200 text-sm mt-1">組合員ポータル</p>
      </div>
      <div className="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl">
        <div className="flex bg-gray-100 rounded-xl p-1 mb-5">
          <button onClick={()=>{setMode('login');setErr('');}} className={`flex-1 py-2 rounded-lg text-sm font-medium transition-colors ${mode==='login'?'bg-white text-gray-900 shadow-sm':'text-gray-500'}`}>ログイン</button>
          <button onClick={()=>{setMode('register');setErr('');}} className={`flex-1 py-2 rounded-lg text-sm font-medium transition-colors ${mode==='register'?'bg-white text-gray-900 shadow-sm':'text-gray-500'}`}>新規登録</button>
        </div>
        {err&&<div className="bg-red-50 text-red-600 text-xs px-3 py-2 rounded-lg mb-4 leading-relaxed">{err}</div>}
        {mode==='login'&&(<>
          <div className="mb-4">
            <label className="text-xs font-bold text-gray-500 mb-1 block">メールアドレス</label>
            <input className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm" type="email" value={email} onChange={e=>setEmail(e.target.value)}/>
          </div>
          <div className="mb-4">
            <label className="text-xs font-bold text-gray-500 mb-1 block">パスワード</label>
            <div className="relative">
              <input className="w-full border border-gray-200 rounded-xl px-4 py-3 pr-10 text-sm" type={showPw?'text':'password'} value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleLogin()}/>
              <button className="absolute right-3 top-3.5 text-gray-400" onClick={()=>setShowPw(!showPw)}><Icon name={showPw?'eyeoff':'eye'} size={18} color="#9ca3af"/></button>
            </div>
          </div>
          <label className="flex items-center gap-2 mb-5 cursor-pointer">
            <input type="checkbox" checked={rememberMe} onChange={e=>setRememberMe(e.target.checked)} className="w-4 h-4 rounded accent-blue-600"/>
            <span className="text-sm text-gray-600">ログイン情報を記憶する</span>
          </label>
          <button onClick={handleLogin} disabled={loading} className={`w-full bg-blue-700 text-white rounded-xl py-3 font-bold text-sm transition-all ${loading?'opacity-60':''}`}>{loading?'ログイン中...':'ログイン'}</button>
          <div className="mt-4 p-3 bg-gray-50 rounded-xl">
            {hasFbConfig?(
              <><p className="text-xs text-green-600 font-bold mb-1">✓ Firebase認証が有効です</p><p className="text-xs text-gray-500">登録済みのメール・パスワードでログインしてください</p></>
            ):(
              <><p className="text-xs text-gray-400 font-bold mb-0.5">デモアカウント（テスト用）</p><p className="text-xs text-gray-400">管理者: admin@union.jp / admin123</p><p className="text-xs text-gray-400">組合員: member@union.jp / member123</p></>
            )}
          </div>
        </>)}
        {mode==='register'&&(<>
          {!getFbConfig()&&<div className="bg-yellow-50 border border-yellow-200 rounded-xl p-3 mb-4 text-xs text-yellow-700">新規登録にはFirebase設定が必要です。管理者に設定を依頼してください。</div>}
          <div className="mb-3"><label className="text-xs font-bold text-gray-500 mb-1 block">氏名</label><input className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm" value={name} onChange={e=>setName(e.target.value)}/></div>
          <div className="mb-3"><label className="text-xs font-bold text-gray-500 mb-1 block">所属課</label><input className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm" value={dept} onChange={e=>setDept(e.target.value)}/></div>
          <div className="mb-3"><label className="text-xs font-bold text-gray-500 mb-1 block">メールアドレス</label><input className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm" type="email" value={email} onChange={e=>setEmail(e.target.value)}/></div>
          <div className="mb-3"><label className="text-xs font-bold text-gray-500 mb-1 block">パスワード（6文字以上）</label><div className="relative"><input className="w-full border border-gray-200 rounded-xl px-4 py-3 pr-10 text-sm" type={showPw?'text':'password'} value={pw} onChange={e=>setPw(e.target.value)}/><button className="absolute right-3 top-3.5" onClick={()=>setShowPw(!showPw)}><Icon name={showPw?'eyeoff':'eye'} size={18} color="#9ca3af"/></button></div></div>
          <div className="mb-5"><label className="text-xs font-bold text-gray-500 mb-1 block">パスワード（確認）</label><input className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm" type="password" value={pw2} onChange={e=>setPw2(e.target.value)}/></div>
          <button onClick={handleRegister} disabled={loading||!getFbConfig()} className={`w-full rounded-xl py-3 font-bold text-sm ${loading||!getFbConfig()?'bg-gray-200 text-gray-400':'bg-blue-700 text-white'}`}>{loading?'登録中...':'登録する'}</button>
        </>)}
      </div>
    </div>
  );
};

const QuestionItem = ({q,idx,total,ans,setAns}) => {
  const typeLabel={single:'単一選択',multi:'複数選択',rating:'5段階評価',text:'自由記述'};
  const a=ans||{selected:null,multiSel:[],rating:0,text:''};
  const toggleMulti=(i)=>setAns({...a,multiSel:a.multiSel.includes(i)?a.multiSel.filter(x=>x!==i):[...a.multiSel,i]});
  return(
    <div className="bg-white rounded-2xl border border-gray-100 p-4 mb-3">
      <div className="flex items-center gap-2 mb-2">
        <span className="w-6 h-6 rounded-full bg-blue-700 text-white text-xs font-bold flex items-center justify-center flex-shrink-0">{idx+1}</span>
        <span className="text-xs text-gray-400">{total}問中{idx+1}問</span>
        <span className="tag bg-gray-100 text-gray-500 text-xs ml-auto">{typeLabel[q.type]||q.type}</span>
      </div>
      <p className="text-sm font-bold text-gray-900 mb-3 leading-snug">{q.text}</p>
      {q.type==='single'&&(
        <div className="space-y-2">
          {(q.options||[]).map((opt,i)=>(
            <button key={i} onClick={()=>setAns({...a,selected:i})} className={`w-full border-2 rounded-xl px-4 py-2.5 text-sm text-left transition-colors ${a.selected===i?'border-blue-600 bg-blue-50 text-blue-700 font-bold':'border-gray-200 text-gray-700'}`}>{opt}</button>
          ))}
        </div>
      )}
      {q.type==='multi'&&(
        <div className="space-y-2">
          <p className="text-xs text-gray-400 mb-1">複数選択できます</p>
          {(q.options||[]).map((opt,i)=>(
            <button key={i} onClick={()=>toggleMulti(i)} className={`w-full border-2 rounded-xl px-4 py-2.5 text-sm text-left flex items-center gap-3 transition-colors ${a.multiSel.includes(i)?'border-blue-600 bg-blue-50 text-blue-700':'border-gray-200 text-gray-700'}`}>
              <div className={`w-5 h-5 rounded border-2 flex items-center justify-center flex-shrink-0 ${a.multiSel.includes(i)?'bg-blue-600 border-blue-600':'border-gray-300'}`}>{a.multiSel.includes(i)&&<Icon name="check" size={12} color="white"/>}</div>
              {opt}
            </button>
          ))}
        </div>
      )}
      {q.type==='rating'&&(
        <div className="text-center">
          <p className="text-xs text-gray-500 mb-3">1（不満）〜 5（満足）</p>
          <div className="flex justify-center gap-2 mb-2">
            {[1,2,3,4,5].map(n=>(
              <button key={n} onClick={()=>setAns({...a,rating:n})} className={`w-12 h-12 rounded-2xl border-2 text-xl font-bold transition-all ${a.rating>=n?'border-yellow-400 bg-yellow-50 text-yellow-500':'border-gray-200 text-gray-300'}`}>★</button>
            ))}
          </div>
          <p className="text-sm text-gray-600 font-medium h-5">{a.rating>0?['','非常に不満','不満','普通','満足','非常に満足'][a.rating]:''}</p>
        </div>
      )}
      {q.type==='text'&&(
        <div>
          <textarea className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm min-h-[100px] resize-none" value={a.text} onChange={e=>setAns({...a,text:e.target.value})} placeholder="ご回答をご記入ください"/>
          <p className="text-xs text-gray-400 mt-1 text-right">{a.text.length}文字</p>
        </div>
      )}
    </div>
  );
};

const SurveyAnswer = ({survey,onBack,onSubmit}) => {
  const [answers,setAnswers]=useState({});
  if(!survey)return null;
  const questions=survey.questions&&survey.questions.length>0
    ?survey.questions
    :[{id:'q0',text:survey.title,type:survey.type||'single',options:survey.options||[]}];
  const setAns=(qId,val)=>setAnswers(a=>({...a,[qId]:val}));
  const isAnswered=(q)=>{
    const a=answers[q.id]||{};
    if(q.type==='single')return a.selected!==null&&a.selected!==undefined;
    if(q.type==='multi')return (a.multiSel||[]).length>0;
    if(q.type==='rating')return (a.rating||0)>0;
    if(q.type==='text')return (a.text||'').trim().length>0;
    return false;
  };
  const canSubmit=questions.every(q=>q.type==='text'||isAnswered(q));
  const answeredCount=questions.filter(isAnswered).length;
  return(
    <div className="fade-in pb-24">
      <Header title="アンケート回答" onBack={onBack}/>
      <div className="px-4 pt-4">
        <div className="bg-white rounded-2xl border border-gray-100 p-4 mb-3">
          <h2 className="text-base font-bold text-gray-900 mb-1">{survey.title}</h2>
          <p className="text-sm text-gray-500">{survey.description}</p>
          <div className="flex items-center gap-3 mt-2">
            <span className="text-xs text-gray-400">期限：{survey.endAt}</span>
            <span className="tag bg-blue-50 text-blue-600">{questions.length}問</span>
            <span className="text-xs text-gray-500 ml-auto">{answeredCount}/{questions.length}問回答済</span>
          </div>
          <div className="mt-2 bg-gray-100 rounded-full h-1.5 overflow-hidden">
            <div className="bg-blue-600 h-1.5 rounded-full transition-all" style={{width:`${Math.round(answeredCount/questions.length*100)}%`}}/>
          </div>
        </div>
        {questions.map((q,i)=>(
          <QuestionItem key={q.id} q={q} idx={i} total={questions.length} ans={answers[q.id]} setAns={(v)=>setAns(q.id,v)}/>
        ))}
        {!canSubmit&&<p className="text-xs text-gray-400 text-center mb-2">必須の設問（単一/複数選択・評価）にすべてご回答ください</p>}
        <button onClick={()=>canSubmit&&onSubmit(answers)} className={`w-full rounded-xl py-3 font-bold text-sm ${canSubmit?'bg-blue-700 text-white':'bg-gray-200 text-gray-400'}`}>回答を送信する</button>
      </div>
    </div>
  );
};

const emptyQuestion=()=>({id:Date.now()+Math.random(),text:'',type:'single',options:['','']});
// アンケート回答済み判定（ユーザー単位）
const isSurveyAnswered=(s,userEmail)=>{
  if(!userEmail)return s.isAnswered||false;
  return (s.answers||[]).some(a=>a.userEmail===userEmail);
};

const SurveyCreate = ({onBack,onSubmit,totalMembers}) => {
  const [draft,setDraft]=useState({title:'',description:'',endAt:'',questions:[emptyQuestion()]});
  const addQuestion=()=>setDraft(d=>({...d,questions:[...d.questions,emptyQuestion()]}));
  const removeQuestion=(qid)=>setDraft(d=>({...d,questions:d.questions.filter(q=>q.id!==qid)}));
  const updateQ=(qid,patch)=>setDraft(d=>({...d,questions:d.questions.map(q=>q.id===qid?{...q,...patch}:q)}));
  const addOpt=(qid)=>{const q=draft.questions.find(x=>x.id===qid);if(q)updateQ(qid,{options:[...q.options,'']});};
  const updateOpt=(qid,i,v)=>{const q=draft.questions.find(x=>x.id===qid);if(!q)return;updateQ(qid,{options:q.options.map((o,j)=>j===i?v:o)});};
  const removeOpt=(qid,i)=>{const q=draft.questions.find(x=>x.id===qid);if(!q||q.options.length<=2)return;updateQ(qid,{options:q.options.filter((_,j)=>j!==i)});};
  const canCreate=draft.title.trim()&&draft.endAt&&!draft.questions.some(q=>!q.text.trim());
  const handleCreate=()=>{
    if(!canCreate)return;
    const cleanedQs=draft.questions.map(q=>({...q,options:(q.type==='single'||q.type==='multi')?q.options.filter(Boolean):[]}));
    onSubmit({...draft,questions:cleanedQs});
  };
  return(
    <div className="fade-in pb-24">
      <Header title="アンケート作成" onBack={onBack}/>
      <div className="px-4 pt-4">
        <div className="bg-white rounded-2xl border border-gray-100 p-4 mb-3">
          <input className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm mb-2" placeholder="アンケートタイトル *" value={draft.title} onChange={e=>setDraft(d=>({...d,title:e.target.value}))}/>
          <textarea className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm mb-2 resize-none" rows={2} placeholder="説明文（任意）" value={draft.description} onChange={e=>setDraft(d=>({...d,description:e.target.value}))}/>
          <div><label className="text-xs font-bold text-gray-500 mb-1 block">回答期限 *</label><input type="date" className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm" value={draft.endAt} onChange={e=>setDraft(d=>({...d,endAt:e.target.value}))}/></div>
        </div>
        <p className="text-xs font-bold text-gray-600 mb-2 px-1">設問（{draft.questions.length}問）</p>
        {draft.questions.map((q,qi)=>(
          <div key={q.id} className="bg-white rounded-2xl border border-gray-100 p-4 mb-3">
            <div className="flex items-center gap-2 mb-2">
              <span className="w-6 h-6 rounded-full bg-blue-700 text-white text-xs font-bold flex items-center justify-center flex-shrink-0">{qi+1}</span>
              <input className="flex-1 border border-gray-200 rounded-xl px-3 py-2 text-sm" placeholder={`設問${qi+1}のテキスト *`} value={q.text} onChange={e=>updateQ(q.id,{text:e.target.value})}/>
              {draft.questions.length>1&&<button onClick={()=>removeQuestion(q.id)} className="text-red-400 text-lg leading-none px-1">×</button>}
            </div>
            <div className="grid grid-cols-2 gap-1.5 mb-3">
              {[['single','単一選択'],['multi','複数選択'],['rating','5段階評価'],['text','自由記述']].map(([v,l])=>(
                <button key={v} onClick={()=>updateQ(q.id,{type:v})} className={`border rounded-lg py-1.5 text-xs font-medium transition-colors ${q.type===v?'border-blue-600 bg-blue-50 text-blue-700':'border-gray-200 text-gray-600'}`}>{l}</button>
              ))}
            </div>
            {(q.type==='single'||q.type==='multi')&&(
              <div>
                {q.options.map((opt,i)=>(
                  <div key={i} className="flex gap-1.5 mb-1.5">
                    <input className="flex-1 border border-gray-200 rounded-xl px-3 py-2 text-sm" placeholder={`選択肢 ${i+1}`} value={opt} onChange={e=>updateOpt(q.id,i,e.target.value)}/>
                    {q.options.length>2&&<button onClick={()=>removeOpt(q.id,i)} className="text-gray-400 px-2 text-lg leading-none">×</button>}
                  </div>
                ))}
                <button onClick={()=>addOpt(q.id)} className="text-xs text-blue-600 mt-0.5">＋ 選択肢を追加</button>
              </div>
            )}
            {q.type==='rating'&&<p className="text-xs text-gray-400 bg-yellow-50 rounded-lg px-3 py-2">★ 1〜5の5段階評価</p>}
            {q.type==='text'&&<p className="text-xs text-gray-400 bg-gray-50 rounded-lg px-3 py-2">📝 自由記述欄</p>}
          </div>
        ))}
        <button onClick={addQuestion} className="w-full border-2 border-dashed border-blue-300 text-blue-600 rounded-xl py-3 text-sm font-medium mb-4 flex items-center justify-center gap-2">
          <Icon name="plus" size={15} color="#2563eb"/>設問を追加する
        </button>
        <button onClick={handleCreate} className={`w-full rounded-xl py-3 font-bold text-sm ${canCreate?'bg-blue-700 text-white':'bg-gray-200 text-gray-400'}`}>アンケートを公開する</button>
      </div>
    </div>
  );
};

const ConsultReplyCheck = ({onBack,consults}) => {
  const [code,setCode]=useState('');
  const [result,setResult]=useState(null);
  const [notFound,setNotFound]=useState(false);
  const handleCheck=()=>{
    const c=consults.find(x=>x.confirmCode===code.trim().toUpperCase());
    if(c){setResult(c);setNotFound(false);}
    else{setResult(null);setNotFound(true);}
  };
  const statusColor={未対応:'bg-red-100 text-red-700',対応中:'bg-yellow-100 text-yellow-700',解決済:'bg-green-100 text-green-700'};
  return(
    <div className="fade-in pb-24">
      <Header title="返信を確認する" onBack={onBack}/>
      <div className="px-4 pt-4">
        <div className="bg-blue-50 border border-blue-200 rounded-xl p-3 mb-4 text-xs text-blue-700">
          <p className="font-bold mb-0.5">🔒 プライバシー保護</p>
          <p>送信時に発行された確認コードを入力してください。あなたの相談内容と担当者からの返信を確認できます。</p>
        </div>
        <div className="bg-white rounded-2xl p-4 border border-gray-100 mb-4">
          <label className="text-xs font-bold text-gray-500 mb-2 block">確認コード</label>
          <div className="flex gap-2">
            <input className="flex-1 border border-gray-200 rounded-xl px-3 py-2.5 text-sm font-mono tracking-widest" placeholder="CL-0000" value={code} onChange={e=>setCode(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleCheck()}/>
            <button onClick={handleCheck} className="bg-blue-700 text-white rounded-xl px-4 py-2.5 text-sm font-bold">確認</button>
          </div>
          {notFound&&<p className="text-xs text-red-500 mt-2">該当する相談が見つかりませんでした。コードをご確認ください。</p>}
        </div>
        {result&&(
          <div className="bg-white rounded-2xl border border-gray-100 p-5">
            <div className="flex items-center gap-2 mb-3">
              <span className={`tag ${statusColor[result.status]||'bg-gray-100 text-gray-600'}`}>{result.status}</span>
              <span className="tag bg-purple-100 text-purple-700">{result.category}</span>
              <span className="text-xs text-gray-400 ml-auto">{result.date}</span>
            </div>
            {result.recipientName&&(
              <div className="flex items-center gap-2 mb-3 bg-gray-50 rounded-xl px-3 py-2">
                <span className="text-xs text-gray-500">送信先：</span>
                <span className="text-xs font-bold text-gray-700">{result.recipientName}</span>
              </div>
            )}
            <div className="mb-4">
              <p className="text-xs font-bold text-gray-400 mb-1">送信した相談内容</p>
              <p className="text-sm text-gray-700 bg-gray-50 rounded-xl p-3 leading-relaxed">{result.content}</p>
            </div>
            {result.adminReply?(
              <div className="bg-blue-50 border border-blue-200 rounded-xl p-4">
                <p className="text-xs font-bold text-blue-700 mb-2">💬 担当者からの返信</p>
                <p className="text-sm text-blue-900 leading-relaxed">{result.adminReply}</p>
              </div>
            ):(
              <div className="bg-gray-50 rounded-xl p-4 text-center">
                <p className="text-sm text-gray-400">担当者がまだ返信していません</p>
                <p className="text-xs text-gray-400 mt-1">対応状況：{result.status}</p>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
};

const AnonConsult = ({onBack,onSubmit,officers}) => {
  const [step,setStep]=useState('recipient');
  const [recipient,setRecipient]=useState(null);
  const [category,setCategory]=useState('');
  const [content,setContent]=useState('');
  const [submitted,setSubmitted]=useState(false);
  const [myCode,setMyCode]=useState('');
  const [copied,setCopied]=useState(false);
  const handleSubmit=()=>{
    if(!category||!content||!recipient)return;
    const code='CL-'+Math.floor(1000+Math.random()*9000);
    onSubmit(category,content,code,recipient);
    setMyCode(code);setSubmitted(true);
  };
  const copyCode=()=>{navigator.clipboard.writeText(myCode).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);}).catch(()=>{});};
  if(submitted){
    return(
      <div className="fade-in pb-24">
        <Header title="送信完了"/>
        <div className="px-4 pt-6">
          <div className="bg-white rounded-2xl border border-gray-100 p-6 text-center">
            <div className="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4"><Icon name="check" size={32} color="#16a34a"/></div>
            <p className="font-bold text-gray-900 text-base mb-1">送信しました</p>
            <p className="text-sm text-gray-500 mb-1"><span className="font-bold text-gray-700">{(recipient&&recipient.name)}</span> に送信されました</p>
            <p className="text-xs text-gray-400 mb-6">本人以外は内容を閲覧できません</p>
            <div className="bg-yellow-50 border-2 border-yellow-300 rounded-2xl p-4 mb-4">
              <p className="text-xs font-bold text-yellow-700 mb-2">⚠️ 必ず控えてください</p>
              <p className="text-xs text-yellow-600 mb-3">この確認コードで返信を確認できます。<br/>画面を閉じると再表示できません。</p>
              <div className="bg-white rounded-xl px-4 py-3 border border-yellow-200 mb-3">
                <p className="text-2xl font-bold text-gray-900 tracking-widest">{myCode}</p>
              </div>
              <button onClick={copyCode} className={`w-full rounded-xl py-2.5 text-sm font-bold transition-colors ${copied?'bg-green-500 text-white':'bg-yellow-400 text-yellow-900'}`}>{copied?'✓ コピーしました！':'確認コードをコピーする'}</button>
            </div>
            <div className="bg-green-50 border border-green-200 rounded-xl p-3 mb-3 text-xs text-green-700">
              <p className="font-bold mb-0.5">📧 ログインメールアドレスに確認コードを送信しました</p>
              <p>メールを確認してコードを保管してください（EmailJS未設定の場合は送信されません）</p>
            </div>
            <div className="bg-purple-50 rounded-xl p-3 text-xs text-purple-700 text-left mb-5">
              <p className="font-bold mb-1">📱 スクリーンショットもおすすめ</p>
              <p>「相談の返信を確認する」からコードを入力して返信を確認できます。</p>
            </div>
            <button onClick={onBack} className="w-full border border-gray-200 rounded-xl py-3 text-sm text-gray-600 font-medium">相談トップに戻る</button>
          </div>
        </div>
      </div>
    );
  }
  if(step==='recipient'){
    const availableOfficers=(officers||[]).filter(o=>o.email);
    return(
      <div className="fade-in pb-24">
        <Header title="送信先を選ぶ" onBack={onBack}/>
        <div className="px-4 pt-4">
          <div className="bg-purple-50 border border-purple-200 rounded-xl p-3 mb-4 text-xs text-purple-700">
            <p className="font-bold mb-0.5">🔒 完全匿名・送信先限定</p>
            <p>選んだ担当者だけが内容を閲覧できます。他の管理者には表示されません。</p>
          </div>
          {availableOfficers.length===0&&(
            <div className="bg-yellow-50 border border-yellow-200 rounded-xl p-4 mb-4 text-xs text-yellow-700">
              <p className="font-bold mb-1">役員情報が未設定です</p>

          )}

                <p className="text-xs text-purple-600 font-bold">{o.title}</p>
                <p className="text-sm font-bold text-gray-900">{o.name}</p>
                <p className="text-xs text-gray-400">{o.dept}</p>
              </div>
              <Icon name="chevron" size={16} color="#9ca3af"/>
            </button>
          ))}
          {availableOfficers.length===0&&(
            <button onClick={()=>{setRecipient({name:'執行部（未指定）',email:''});setStep('form');}} className="w-full bg-gray-50 border border-gray-200 rounded-xl py-3 text-sm text-gray-500">役員未設定のまま続ける</button>

  return (

      <Header title="匿名相談フォーム" onBack={()=>setStep('recipient')}/>

        <div className="bg-purple-50 border border-purple-200 rounded-xl p-3 mb-4">

            <span className="text-xs font-bold text-purple-800">{(recipient&&recipient.name)}</span>
            <button onClick={()=>setStep('recipient')} className="text-xs text-purple-500 underline ml-auto">変更</button>
          </div>
          <p className="text-xs text-purple-600 mt-1">この担当者のみ閲覧できます</p>
        </div>
        <div className="bg-white rounded-2xl p-4 border border-gray-100">
          <div className="mb-4">
            <label className="text-xs font-bold text-gray-500 mb-1 block">相談カテゴリ</label>
            <select className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm" value={category} onChange={e=>setCategory(e.target.value)}>

            {c.adminReply&&!reply&&<p className="text-xs text-blue-500 mb-1">✓ 返信済み</p>}

const SurveyResultsPanel = ({s, onBack}) => {
  const [resultTab,setResultTab]=useState('summary');
  const qs=s.questions&&s.questions.length>0?s.questions:[{id:'q0',text:s.title,type:s.type||'single',options:s.options||[]}];
  const answers=s.answers||[];

  const exportCsv=()=>{
    const headers=['氏名','所属','回答日',...qs.map((q,i)=>'Q'+(i+1)+': '+q.text)];
    const rows=answers.map(a=>{
      const row=[a.userName||'',a.userDept||'',a.date||''];
      qs.forEach(q=>{
        const r=(a.responses||{})[q.id]||{};
        if(q.type==='single'){row.push(r.selected!=null?(q.options||[])[r.selected]||'':'未回答');}
        else if(q.type==='multi'){row.push(((r.multiSel||[]).map(i=>(q.options||[])[i])).join('/'));}
        else if(q.type==='rating'){row.push(r.rating||'');}
        else{row.push((r.text||'').split('\n').join(' '));}
      });
      return row;
    });
    const csv=[headers,...rows].map(r=>r.map(c=>'"'+String(c||'').split('"').join('""')+'"').join(',')).join(String.fromCharCode(10));
    const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=s.title+'_回答結果.csv';
    a.click();
  };

  const calcSummary=(q)=>{
    if(q.type==='single'||q.type==='multi'){
      const counts=(q.options||[]).map((_,i)=>{
        if(q.type==='single')return answers.filter(a=>((a.responses||{})[q.id]||{}).selected===i).length;
        return answers.filter(a=>(((a.responses||{})[q.id]||{}).multiSel||[]).includes(i)).length;
      });
      const total=answers.filter(a=>{const r=((a.responses||{})[q.id]||{});return q.type==='single'?r.selected!=null:(r.multiSel||[]).length>0;}).length||1;
      return counts.map((c,i)=>({label:(q.options||[])[i],count:c,pct:Math.round(c/total*100)}));
    }
    if(q.type==='rating'){
      const vals=answers.map(a=>((a.responses||{})[q.id]||{}).rating||0).filter(v=>v>0);
      const avg=vals.length?Math.round(vals.reduce((sum,v)=>sum+v,0)/vals.length*10)/10:0;
      return {avg,count:vals.length};
    }
    return null;
  };

  return(
    <div className="fade-in pb-24">
      <Header title="アンケート結果" onBack={onBack} right={
        <button onClick={exportCsv} className="bg-white/20 text-white text-xs px-3 py-1.5 rounded-full flex items-center gap-1">
          <Icon name="board" size={13} color="white"/>CSV出力
        </button>
      }/>
      <div className="px-4 pt-4">
        <div className="bg-white rounded-2xl border border-gray-100 p-4 mb-3">
          <h2 className="font-bold text-gray-900 mb-1">{s.title}</h2>
          <p className="text-xs text-gray-500">回答数: {answers.length}人 / {s.totalCount}人（{s.totalCount>0?Math.round(answers.length/s.totalCount*100):0}%）</p>
        </div>
        <div className="flex bg-white rounded-xl border border-gray-100 mb-4 overflow-hidden">
          {[['summary','集計結果'],['detail','回答者一覧']].map(([id,label])=>(
            <button key={id} onClick={()=>setResultTab(id)} className={'flex-1 py-2.5 text-xs font-medium '+(resultTab===id?'bg-blue-700 text-white':'text-gray-500')}>{label}</button>
          ))}
        </div>
        {resultTab==='summary'&&(
          <div>
            {qs.map((q,qi)=>{
              const sum=calcSummary(q);
              return(
                <div key={String(q.id)} className="bg-white rounded-xl border border-gray-100 p-4 mb-3">
                  <div className="flex items-center gap-2 mb-3">
                    <span className="w-5 h-5 rounded-full bg-blue-700 text-white text-xs font-bold flex items-center justify-center">{qi+1}</span>
                    <p className="text-sm font-bold text-gray-900 flex-1">{q.text}</p>
                  </div>
                  {(q.type==='single'||q.type==='multi')&&Array.isArray(sum)&&sum.map((item,i)=>(
                    <div key={i} className="mb-2">
                      <div className="flex justify-between text-xs text-gray-600 mb-1">
                        <span>{item.label}</span><span className="font-bold">{item.count}人（{item.pct}%）</span>
                      </div>
                      <div className="bg-gray-100 rounded-full h-2"><div className="bg-blue-600 h-2 rounded-full" style={{width:item.pct+'%'}}/></div>
                    </div>
                  ))}
                  {q.type==='rating'&&sum&&(
                    <div className="text-center py-2">
                      <p className="text-3xl font-bold text-yellow-500">{'★'.repeat(Math.round(sum.avg))}</p>
                      <p className="text-sm font-bold text-gray-700 mt-1">平均 {sum.avg} / 5（{sum.count}人回答）</p>
                    </div>
                  )}
                  {q.type==='text'&&(
                    <div className="space-y-1.5">
                      {answers.filter(a=>((a.responses||{})[q.id]||{}).text).map((a,i)=>(
                        <div key={i} className="bg-gray-50 rounded-lg px-3 py-2 text-xs text-gray-700">
                          <span className="font-bold text-gray-500 mr-2">{a.userName}</span>{((a.responses||{})[q.id]||{}).text}
                        </div>
                      ))}
                      {answers.filter(a=>((a.responses||{})[q.id]||{}).text).length===0&&<p className="text-xs text-gray-400 italic">回答なし</p>}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
        {resultTab==='detail'&&(
          <div className="bg-white rounded-xl border border-gray-100 overflow-hidden">
            {answers.length===0?<p className="text-center py-8 text-gray-400 text-sm">まだ回答がありません</p>:
            answers.map((a,i)=>(
              <div key={i} className="px-4 py-3 border-b border-gray-100 last:border-0">
                <div className="flex items-center gap-2 mb-1">
                  <span className="text-sm font-bold text-gray-900">{a.userName||'不明'}</span>
                  <span className="text-xs text-gray-500">{a.userDept}</span>
                  <span className="text-xs text-gray-400 ml-auto">{a.date}</span>
                </div>
                {qs.map((q,qi)=>{
                  const r=(a.responses||{})[q.id]||{};
                  let ans='';
                  if(q.type==='single')ans=r.selected!=null?(q.options||[])[r.selected]||'':'';
                  else if(q.type==='multi')ans=((r.multiSel||[]).map(idx=>(q.options||[])[idx])).join('・');
                  else if(q.type==='rating')ans=r.rating?'★'+r.rating:'';
                  else ans=r.text||'';
                  return ans?<p key={qi} className="text-xs text-gray-600 ml-1">Q{qi+1}: <span className="font-medium text-gray-800">{ans}</span></p>:null;
                })}
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
};


const AdminSurveys = ({onBack,surveys,setSurveys,showToast}) => {
  const [showForm,setShowForm]=useState(false);
  const [draft,setDraft]=useState({title:'',description:'',endAt:'',questions:[emptyQuestion()]});
  const [viewResult,setViewResult]=useState(null);
  const addQuestion=()=>setDraft(d=>({...d,questions:[...d.questions,emptyQuestion()]}));
  const removeQuestion=(qid)=>setDraft(d=>({...d,questions:d.questions.filter(q=>q.id!==qid)}));
  const updateQ=(qid,patch)=>setDraft(d=>({...d,questions:d.questions.map(q=>q.id===qid?{...q,...patch}:q)}));
  const addOption=(qid)=>updateQ(qid,{options:[...(((draft.questions.find(q=>q.id===qid)||{}).options)||[]),'']});
  const updateOption=(qid,i,v)=>{const q=draft.questions.find(x=>x.id===qid);if(!q)return;updateQ(qid,{options:q.options.map((o,j)=>j===i?v:o)});};
  const removeOption=(qid,i)=>{const q=draft.questions.find(x=>x.id===qid);if(!q||q.options.length<=2)return;updateQ(qid,{options:q.options.filter((_,j)=>j!==i)});};
  const createSurvey=()=>{
    if(!draft.title||!draft.endAt||draft.questions.some(q=>!q.text.trim()))return;
    const cleanedQs=draft.questions.map(q=>({...q,options:(q.type==='single'||q.type==='multi')?q.options.filter(Boolean):[]}));
    const ns={id:Date.now(),...draft,questions:cleanedQs,status:'active',isAnswered:false,answerCount:0,totalCount:58};
    setSurveys(ss=>[ns,...ss]);setShowForm(false);
    setDraft({title:'',description:'',endAt:'',questions:[emptyQuestion()]});
    showToast('アンケートを作成しました');
  };
  const toggleStatus=(id)=>setSurveys(ss=>ss.map(s=>s.id===id?{...s,status:s.status==='active'?'closed':'active'}:s));
  const deleteSurvey=(id)=>{if(confirm('削除しますか？'))setSurveys(ss=>ss.filter(s=>s.id!==id));};
  if(viewResult){
    const s=surveys.find(x=>x.id===viewResult);
    if(!s)return null;
    return <SurveyResultsPanel key={String(viewResult)} s={s} onBack={()=>setViewResult(null)}/>;
  }
  return(
    <div className="fade-in pb-24">
      <Header title="アンケート管理" onBack={onBack} right={<button onClick={()=>setShowForm(true)} className="bg-white/20 text-white text-xs px-3 py-1.5 rounded-full flex items-center gap-1"><Icon name="plus" size={14} color="white"/>作成</button>}/>
      <div className="px-4 pt-4">
        {showForm&&(
          <div className="bg-white rounded-2xl border border-blue-200 p-4 mb-4">
            <p className="font-bold text-sm text-gray-900 mb-3">新規アンケート作成</p>
            <input className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm mb-2" placeholder="タイトル *" value={draft.title} onChange={e=>setDraft(d=>({...d,title:e.target.value}))}/>
            <textarea className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm mb-2 resize-none" rows={2} placeholder="説明文（任意）" value={draft.description} onChange={e=>setDraft(d=>({...d,description:e.target.value}))}/>
            <div className="mb-3"><label className="text-xs font-bold text-gray-500 mb-1 block">回答期限 *</label><input type="date" className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm" value={draft.endAt} onChange={e=>setDraft(d=>({...d,endAt:e.target.value}))}/></div>
            <p className="text-xs font-bold text-gray-700 mb-2">設問（{draft.questions.length}問）</p>
            {draft.questions.map((q,qi)=>(
              <div key={q.id} className="border border-gray-200 rounded-xl p-3 mb-3 bg-gray-50">
                <div className="flex items-center gap-2 mb-2">
                  <span className="w-5 h-5 rounded-full bg-blue-600 text-white text-xs font-bold flex items-center justify-center flex-shrink-0">{qi+1}</span>
                  <input className="flex-1 border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white" placeholder={`設問${qi+1} *`} value={q.text} onChange={e=>updateQ(q.id,{text:e.target.value})}/>
                  {draft.questions.length>1&&<button onClick={()=>removeQuestion(q.id)} className="text-red-400 text-lg px-1">×</button>}
                </div>
                <div className="grid grid-cols-2 gap-1 mb-2">
                  {[['single','単一選択'],['multi','複数選択'],['rating','5段階評価'],['text','自由記述']].map(([v,l])=>(
                    <button key={v} onClick={()=>updateQ(q.id,{type:v})} className={`border rounded-lg py-1.5 text-xs font-medium transition-colors ${q.type===v?'border-blue-600 bg-blue-50 text-blue-700':'border-gray-200 text-gray-600 bg-white'}`}>{l}</button>
                  ))}
                </div>
                {(q.type==='single'||q.type==='multi')&&(
                  <div>
                    {q.options.map((opt,i)=>(
                      <div key={i} className="flex gap-1 mb-1">
                        <input className="flex-1 border border-gray-200 rounded-lg px-2 py-1.5 text-xs bg-white" placeholder={`選択肢 ${i+1}`} value={opt} onChange={e=>updateOption(q.id,i,e.target.value)}/>
                        {q.options.length>2&&<button onClick={()=>removeOption(q.id,i)} className="text-gray-400 px-1.5">×</button>}
                      </div>
                    ))}
                    <button onClick={()=>addOption(q.id)} className="text-xs text-blue-600 mt-0.5">＋ 選択肢を追加</button>
                  </div>
                )}
                {q.type==='rating'&&<p className="text-xs text-gray-400">★ 1〜5の5段階評価</p>}
                {q.type==='text'&&<p className="text-xs text-gray-400">📝 自由記述</p>}
              </div>
            ))}
            <button onClick={addQuestion} className="w-full border-2 border-dashed border-blue-300 text-blue-600 rounded-xl py-2.5 text-sm font-medium mb-3 flex items-center justify-center gap-1"><Icon name="plus" size={15} color="#2563eb"/>設問を追加</button>
            <div className="flex gap-2">
              <button onClick={()=>setShowForm(false)} className="flex-1 border border-gray-200 rounded-xl py-2.5 text-sm text-gray-600">キャンセル</button>
              <button onClick={createSurvey} disabled={!draft.title||!draft.endAt||draft.questions.some(q=>!q.text.trim())} className={`flex-1 rounded-xl py-2.5 text-sm font-bold ${draft.title&&draft.endAt&&!draft.questions.some(q=>!q.text.trim())?'bg-blue-700 text-white':'bg-gray-200 text-gray-400'}`}>作成する</button>
            </div>
          </div>
        )}
        {surveys.map(s=>(
          <div key={s.id} className="bg-white rounded-xl border border-gray-100 p-4 mb-2">
            <p className="text-sm font-bold text-gray-900 truncate">{s.title}</p>
            <div className="flex items-center gap-2 mt-1 flex-wrap">
              <StatusBadge status={s.status}/>
              <span className="tag bg-gray-100 text-gray-500">{(s.questions||[{id:0}]).length}問</span>
              <span className="text-xs text-gray-400">期限 {s.endAt}</span>
              <span className="text-xs text-gray-500 font-medium">{s.answerCount}/{s.totalCount}人</span>
            </div>
            <div className="flex gap-2 mt-3">
              <button onClick={()=>setViewResult(s.id)} className="flex-1 border border-gray-200 rounded-lg py-2 text-xs text-gray-600">結果を見る</button>
              <button onClick={()=>toggleStatus(s.id)} className={`flex-1 border rounded-lg py-2 text-xs font-bold ${s.status==='active'?'border-red-200 text-red-600':'border-green-200 text-green-600'}`}>{s.status==='active'?'締め切る':'再開する'}</button>
              <button onClick={()=>deleteSurvey(s.id)} className="border border-red-100 text-red-400 rounded-lg py-2 px-3 text-xs">削除</button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
};

const AdminFAQs = ({onBack,faqs,setFaqs,showToast}) => {
  const [showForm,setShowForm]=useState(false);
  const [editId,setEditId]=useState(null);
  const [form,setForm]=useState({category:'',q:'',a:''});
  const openAdd=()=>{setForm({category:'',q:'',a:''});setEditId(null);setShowForm(true);};
  const openEdit=(f)=>{setForm({category:f.category,q:f.q,a:f.a});setEditId(f.id);setShowForm(true);};
  const saveForm=()=>{
    if(!form.q||!form.a)return;
    if(editId){setFaqs(fs=>fs.map(f=>f.id===editId?{...f,...form}:f));showToast('FAQを更新しました');}
    else{setFaqs(fs=>[...fs,{id:Date.now(),...form}]);showToast('FAQを追加しました');}
    setShowForm(false);setEditId(null);
  };
  const deleteFaq=(id)=>{if(confirm('削除しますか？'))setFaqs(fs=>fs.filter(f=>f.id!==id));};
  return(
    <div className="fade-in pb-24">
      <Header title="FAQ管理" onBack={onBack} right={<button onClick={openAdd} className="bg-white/20 text-white text-xs px-3 py-1.5 rounded-full flex items-center gap-1"><Icon name="plus" size={14} color="white"/>追加</button>}/>
      <div className="px-4 pt-4">
        {showForm&&(
          <div className="bg-white rounded-2xl border border-blue-200 p-4 mb-4">
            <p className="font-bold text-sm text-gray-900 mb-3">{editId?'FAQ編集':'FAQ追加'}</p>
            <input className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm mb-2" placeholder="カテゴリ（例：労働時間・休暇）" value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))}/>
            <input className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm mb-2" placeholder="質問 *" value={form.q} onChange={e=>setForm(f=>({...f,q:e.target.value}))}/>
            <textarea className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm mb-3 resize-none min-h-[80px]" placeholder="回答 *" value={form.a} onChange={e=>setForm(f=>({...f,a:e.target.value}))}/>
            <div className="flex gap-2">
              <button onClick={()=>setShowForm(false)} className="flex-1 border border-gray-200 rounded-xl py-2.5 text-sm text-gray-600">キャンセル</button>
              <button onClick={saveForm} className="flex-1 bg-blue-700 text-white rounded-xl py-2.5 text-sm font-bold">保存する</button>
            </div>
          </div>
        )}

          <div key={f.id} className="bg-white rounded-xl border border-gray-100 p-4 mb-2">

              <div className="flex-1 min-w-0">

                <p className="text-sm font-bold text-gray-900 mb-1">{f.q}</p>

              <button onClick={()=>deleteFaq(f.id)} className="p-2 text-gray-300 hover:text-red-400 flex-shrink-0"><Icon name="trash" size={15} color="currentColor"/></button>

const App = () => {
  const [user,setUser]=useState(null);
  const [tab,setTab]=useState('home');
  const [boardView,setBoardView]=useState('list');
  const [selectedPost,setSelectedPost]=useState(null);
  const [surveyView,setSurveyView]=useState('list');
  const [selectedSurvey,setSelectedSurvey]=useState(null);
  const [consultView,setConsultView]=useState('top');
  const [subScreen,setSubScreen]=useState(null);
  const [posts,setPosts]=useState(()=>loadData('union_posts',SAMPLE_POSTS));
  const [surveys,setSurveys]=useState(()=>loadData('union_surveys',SAMPLE_SURVEYS));
  const [consults,setConsults]=useState(()=>loadData('union_consults',SAMPLE_CONSULTS));
  const [members,setMembers]=useState(()=>loadData('union_members',SAMPLE_MEMBERS));
  const [faqs,setFaqs]=useState(()=>loadData('union_faqs',SAMPLE_FAQS));
  const [officers,setOfficers]=useState(()=>loadData('union_officers',SAMPLE_OFFICERS));
  const [activities,setActivities]=useState(()=>loadData('union_activities',SAMPLE_ACTIVITIES));
  const [toast,setToast]=useState(null);
  const [adminSetupPrompt,setAdminSetupPrompt]=useState(false);
  const [profileSetupPrompt,setProfileSetupPrompt]=useState(false);

  useEffect(()=>saveData('union_posts',posts),[posts]);
  useEffect(()=>saveData('union_surveys',surveys),[surveys]);
  useEffect(()=>saveData('union_consults',consults),[consults]);
  useEffect(()=>saveData('union_members',members),[members]);
  useEffect(()=>saveData('union_faqs',faqs),[faqs]);
  useEffect(()=>saveData('union_officers',officers),[officers]);
  useEffect(()=>saveData('union_activities',activities),[activities]);

  // ─── Firestore リアルタイム同期（ログイン後に自動実行）──────────────────
  useEffect(()=>{
    const fs=getFs();
    if(!fs||!user)return;
    const col=fs.collection('union');
    const pairs=[
      {key:'union_posts',set:setPosts,cur:posts},
      {key:'union_surveys',set:setSurveys,cur:surveys},
      {key:'union_consults',set:setConsults,cur:consults},
      {key:'union_members',set:setMembers,cur:members},
      {key:'union_faqs',set:setFaqs,cur:faqs},
      {key:'union_officers',set:setOfficers,cur:officers},
      {key:'union_activities',set:setActivities,cur:activities},
    ];
    // 初回：Firestoreが空ならローカルデータを書き込む
    pairs.forEach(({key,cur})=>{
      col.doc(key).get().then(snap=>{
        if(!snap.exists)col.doc(key).set({d:cur}).catch(()=>{});
      }).catch(()=>{});
    });
    // リアルタイム同期リスナー
    const unsubs=pairs.map(({key,set})=>
      col.doc(key).onSnapshot(snap=>{
        if(snap.exists&&snap.data()&&snap.data().d){
          const data=snap.data().d;
          localStorage.setItem(key,JSON.stringify(data));
          set(data);
          // メンバーデータが来たら即座にユーザー情報を補正
          if(key==='union_members'&&user){
            const prof=data.find(m=>m.email===user.email);
            if(prof&&(user.name!==prof.name||user.role!==prof.role||user.dept!==prof.dept)){
              setUser(u=>({...u,name:prof.name,dept:prof.dept,role:prof.role}));
            }
          }
        }
      },()=>{})
    );
    return ()=>unsubs.forEach(u=>u());
  },[user]);

  const showToast=msg=>setToast(msg);
  const clearSub=()=>setSubScreen(null);

  // ─── スマホ戻るボタン対応 ────────────────────────────────────────────────
  const navStateRef=useRef({});
  useEffect(()=>{
    navStateRef.current={subScreen,boardView,surveyView,consultView,tab};
  },[subScreen,boardView,surveyView,consultView,tab]);

  // 深い画面に遷移したらhistoryエントリを積む
  useEffect(()=>{
    const {subScreen:s,boardView:bv,surveyView:sv,consultView:cv}=navStateRef.current;
    const isDeep=s||bv!=='list'||sv!=='list'||cv!=='top';
    if(isDeep)window.history.pushState({appNav:1},'');
  },[subScreen,boardView,surveyView,consultView]);

  // 戻るボタンでアプリ内ナビゲーション
  useEffect(()=>{
    window.history.pushState({appNav:1},''); // 初期エントリ
    const handlePop=()=>{
      const {subScreen:s,boardView:bv,surveyView:sv,consultView:cv}=navStateRef.current;
      if(s){setSubScreen(null);}
      else if(bv!=='list'){setBoardView('list');setSelectedPost(null);}
      else if(sv!=='list'){setSurveyView('list');setSelectedSurvey(null);}
      else if(cv!=='top'){setConsultView('top');}
      else{window.history.pushState({appNav:1},'');} // ルート→アプリを閉じない
    };
    window.addEventListener('popstate',handlePop);
    return()=>window.removeEventListener('popstate',handlePop);
  },[]);

  const handleNav=(t,item=null)=>{
    setTab(t);setSubScreen(null);
    if(t==='board'){setBoardView(item?'detail':'list');setSelectedPost(item);}
    if(t==='survey'){setSurveyView(item?'answer':'list');setSelectedSurvey(item);}
    if(t==='consult')setConsultView('top');
    if(t==='kyosai')setSubScreen('kyosai');
    if(t==='union_info')setSubScreen('union_info');
  };

  const addPost=async(form)=>{
    const np={id:Date.now(),...form,authorName:user.name,publishedAt:new Date().toISOString().slice(0,10),readCount:0,totalCount:members.length,isRead:true};
    setPosts(ps=>[np,...ps]);setBoardView('list');showToast('記事を公開しました');
    if(notifOn('newPost')){
      const ejsCfg=getEjsCfg();
      if(ejsCfg.allEmail&&ejsCfg.publicKey&&ejsCfg.serviceId&&ejsCfg.templateId){
        const subj='【組合お知らせ】'+form.title;
        const bd='西ノ島町職員組合より新しいお知らせが届きました。\n\n'+(CATEGORY_MAP[form.category]||{}).label+'：'+form.title+'\n\n'+form.body.slice(0,200)+'\n\nポータルからご確認ください。';
        sendMail({type:'newPost',to:ejsCfg.allEmail,subject:subj,body:bd,senderName:user.name+'（西ノ島町職員組合）'})
          .then(r=>{if(!r.skipped)showToast('メール通知を送信しました');})
          .catch(e=>showToast('メール送信エラー: '+e.message));
      }
    }
  };

  const submitSurvey=(answerData)=>{
    const response={
      userName:user.name,
      userDept:user.dept,
      userEmail:user.email,
      date:new Date().toISOString().slice(0,10),
      responses:answerData||{}
    };
    setSurveys(ss=>ss.map(s=>s.id===selectedSurvey.id?{
      ...s,isAnswered:true,answerCount:s.answerCount+1,
      answers:[...(s.answers||[]),response]
    }:s));
    setSurveyView('list');showToast('回答を送信しました');
  };

  const handleAnonSubmit=(category,content,code,recipient)=>{
    const nc={id:Date.now(),category,content,date:new Date().toISOString().slice(0,10),status:'未対応',confirmCode:code,recipientName:(recipient&&recipient.name)||'',recipientEmail:(recipient&&recipient.email)||'',adminNote:'',adminReply:''};
    setConsults(cs=>[nc,...cs]);
    const toAdmin=(recipient&&recipient.email)||getEjsCfg().adminEmail;
    if(notifOn('anonConsult')&&toAdmin){
      sendMail({type:'anonConsult',to:toAdmin,subject:`【要対応】匿名相談が届きました（${category}）`,body:`匿名相談が届いています。\n送信先：${(recipient&&recipient.name)||'未指定'}\nカテゴリ：${category}\n確認コード：${code}\n受信日時：${new Date().toLocaleString('ja-JP')}\n\n管理者画面からご確認ください。`,senderName:'組合ポータル（自動送信）'}).catch(e=>console.warn(e));
    }
    if(user&&user.email&&getEjsCfg().publicKey){
      sendMail({type:'anonReply',to:user.email,subject:'【組合相談】確認コードのお知らせ',body:`匿名相談を受け付けました。\n\n確認コード：${code}\n\nポータルの「相談の返信を確認する」にこのコードを入力すると、対応状況と担当者からの返信を確認できます。\nコードは大切に保管してください。\n\n西ノ島町職員組合`,senderName:'西ノ島町職員組合（自動送信）'}).catch(e=>console.warn(e));
    }
  };

  const handleReserveSubmit=(form)=>{
    setConsultView('top');showToast('予約を受け付けました');
    if(notifOn('reservation')&&getEjsCfg().adminEmail){
      sendMail({type:'reservation',to:getEjsCfg().adminEmail,subject:'【要確認】相談予約が届きました',body:`相談予約が1件届いています。\n方法：${form.type==='face'?'対面':'電話'}\n希望日時：${form.date} ${form.time}\n概要：${form.topic||'未記入'}`,senderName:'組合ポータル（自動送信）'}).catch(e=>console.warn(e));
    }
  };

  // membersデータが同期されたとき、ログイン中ユーザーの名前・役割を補正
  useEffect(()=>{
    if(!user||!members||members.length===0)return;
    const profile=members.find(m=>m.email===user.email);
    if(!profile)return;
    const needsUpdate=
      (user.name!==profile.name)||
      (user.role!==profile.role)||
      (user.dept!==profile.dept);
    if(needsUpdate)setUser(u=>({...u,name:profile.name,dept:profile.dept,role:profile.role}));
  },[members]);

  const unreads={board:posts.filter(p=>!p.isRead).length,survey:surveys.filter(s=>s.status==='active'&&!isSurveyAnswered(s,user&&user.email)).length};
  const handleUserLogin=(u)=>{
    setUser(u);
    // 名前がメールアドレス(@前)のままならプロフィール設定を促す
    if(u.name===u.email.split('@')[0]){
      setProfileSetupPrompt(true);
    }
  };
  if(!user)return <LoginScreen onLogin={handleUserLogin}/>;

  const renderContent=()=>{
    if(subScreen==='notif')return <NotificationSettings onBack={clearSub}/>;
    if(subScreen==='firebase')return <FirebaseSettings onBack={clearSub}/>;
    if(subScreen==='union_info')return <UnionInfoScreen onBack={clearSub} isAdmin={user.role==='admin'} officers={officers} setOfficers={setOfficers} activities={activities} setActivities={setActivities} showToast={showToast}/>;
    if(subScreen==='admin_consults')return <AdminConsults onBack={clearSub} consults={consults} setConsults={setConsults} user={user}/>;
    if(subScreen==='admin_surveys')return <AdminSurveys onBack={clearSub} surveys={surveys} setSurveys={setSurveys} showToast={showToast}/>;
    if(subScreen==='admin_members')return <AdminMembers onBack={clearSub} members={members} setMembers={setMembers} showToast={showToast}/>;
    if(subScreen==='admin_faqs')return <AdminFAQs onBack={clearSub} faqs={faqs} setFaqs={setFaqs} showToast={showToast}/>;
    if(subScreen==='kyosai')return <KyosaiScreen onBack={clearSub}/>;
    if(tab==='home')return <Dashboard posts={posts} surveys={surveys} onNav={handleNav} user={user}/>;
    if(tab==='board'){
      if(boardView==='new')return <PostForm onBack={()=>setBoardView('list')} onSubmit={addPost}/>;
      if(boardView==='detail')return <BoardDetail post={selectedPost} onBack={()=>setBoardView('list')} onMarkRead={id=>setPosts(ps=>ps.map(p=>p.id===id?{...p,isRead:true,readCount:p.isRead?p.readCount:p.readCount+1}:p))} isAdmin={user.role==='admin'} onDelete={id=>setPosts(ps=>ps.filter(p=>p.id!==id))}/>;
      return <BoardList posts={posts} onSelect={p=>{setSelectedPost(p);setBoardView('detail');}} isAdmin={user.role==='admin'} onNew={()=>setBoardView('new')} currentUser={user.email} onReact={(id,emoji)=>setPosts(ps=>ps.map(p=>{if(p.id!==id)return p;const r={...(p.reactions||{})};const u=r[emoji]||[];r[emoji]=u.includes(user.email)?u.filter(x=>x!==user.email):[...u,user.email];return{...p,reactions:r};}))}/>;
    }
    if(tab==='survey'){
      if(surveyView==='new')return <SurveyCreate onBack={()=>setSurveyView('list')} totalMembers={members.length} onSubmit={(form)=>{const ns={id:Date.now(),...form,status:'active',isAnswered:false,answerCount:0,totalCount:members.length};setSurveys(ss=>[ns,...ss]);setSurveyView('list');showToast('アンケートを公開しました');}}/>;
      if(surveyView==='answer'&&selectedSurvey&&!isSurveyAnswered(selectedSurvey,user&&user.email))return <SurveyAnswer survey={selectedSurvey} onBack={()=>setSurveyView('list')} onSubmit={submitSurvey}/>;
      return <SurveyList surveys={surveys} onSelect={s=>{setSelectedSurvey(s);setSurveyView('answer');}} isAdmin={user.role==='admin'} onNew={()=>setSurveyView('new')} userEmail={user.email}/>;
    }
    if(tab==='consult'){
      if(consultView==='anon')return <AnonConsult onBack={()=>setConsultView('top')} onSubmit={handleAnonSubmit} officers={officers}/>;
      if(consultView==='check')return <ConsultReplyCheck onBack={()=>setConsultView('top')} consults={consults}/>;
      if(consultView==='faq')return <FAQScreen onBack={()=>setConsultView('top')} faqs={faqs}/>;
      if(consultView==='reserve')return <ReserveScreen onBack={()=>setConsultView('top')} onSubmit={handleReserveSubmit}/>;
      return <ConsultTop onSelect={v=>setConsultView(v)}/>;
    }
    if(tab==='menu')return <MenuScreen user={user} onLogout={()=>{setUser(null);setTab('home');}} onNotifSettings={()=>setSubScreen('notif')} onFirebaseSettings={()=>setSubScreen('firebase')} onAdminNav={id=>setSubScreen('admin_'+id)} onUnionInfo={()=>setSubScreen('union_info')} onPromote={()=>setAdminSetupPrompt(true)}/>;
    return null;
  };

  const showNav=!subScreen;
  const changeTab=(t)=>{
    // 自治労共済・組合情報はsubScreenで管理
    if(t==='kyosai'){setSubScreen('kyosai');return;}
    if(t==='union_info'){setSubScreen('union_info');return;}
    // 通常タブ遷移：subScreenをクリアして切り替え
    setSubScreen(null);
    setTab(t);
    setBoardView('list');setSurveyView('list');setConsultView('top');
  };
  return (
    <div className="bg-gray-50 min-h-screen">
      {/* デスクトップサイドバー */}
      <DesktopSidebar active={tab} subScreen={subScreen} onChange={changeTab} user={user} unreads={unreads}
        onLogout={()=>{setUser(null);setTab('home');}}
        onAdminNav={id=>setSubScreen('admin_'+id)}
        onUnionInfo={()=>setSubScreen('union_info')}
        onFirebase={()=>setSubScreen('firebase')}
        onNotif={()=>setSubScreen('notif')}
      />
      {/* コンテンツエリア */}
      <div className="md:ml-60">
        <div className="max-w-[480px] mx-auto md:max-w-none min-h-screen bg-gray-50">
          {renderContent()}
        </div>
      </div>
      {/* モバイル用ボトムナビ */}
      {showNav&&<div className="md:hidden"><BottomNav active={tab} onChange={changeTab} unreads={unreads}/></div>}
      {profileSetupPrompt&&user&&(
        <ProfileSetupModal user={user} onSave={(name,dept)=>{
          const updated={...user,name,dept};
          setUser(updated);
          // メンバーリストに追加/更新
          setMembers(ms=>{
            const exists=ms.some(m=>m.email===user.email);
            const newMs=exists?ms.map(m=>m.email===user.email?{...m,name,dept}:m):[...ms,{id:Date.now(),name,dept,email:user.email,role:'member',joinDate:new Date().toISOString().slice(0,10)}];
            saveData('union_members',newMs);
            return newMs;
          });
          setProfileSetupPrompt(false);
        }}/>
      )}
      {adminSetupPrompt&&(
        <AdminPromoteModal
          user={user}
          onClose={()=>setAdminSetupPrompt(false)}
          onPromote={(email)=>{
            const mems=loadData('union_members',SAMPLE_MEMBERS);
            const exists=mems.some(m=>m.email===email);
            const updated=exists?mems.map(m=>m.email===email?{...m,role:'admin'}:m):[...mems,{id:Date.now(),name:user.name,dept:user.dept||'',email,role:'admin',joinDate:new Date().toISOString().slice(0,10)}];
            saveData('union_members',updated);
            setMembers(updated);
            setUser(u=>({...u,role:'admin'}));
            setAdminSetupPrompt(false);
            showToast('管理者に設定しました');
          }}
        />
      )}
      {toast&&<Toast msg={toast} onClose={()=>setToast(null)}/>}
    </div>
  );
};


class ErrorBoundary extends React.Component {
  constructor(props){super(props);this.state={error:null};}
  componentDidCatch(error,info){this.setState({error:error.toString()+'\n\nComponent Stack:\n'+info.componentStack});}
  render(){
    if(this.state.error)return(
      <div style={{padding:'20px',color:'red',background:'white',fontFamily:'monospace',whiteSpace:'pre-wrap',fontSize:'12px'}}>
        <b>Reactレンダリングエラー:</b><br/>{this.state.error}
      </div>
    );
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>

<script>
// 診断: CDNスクリプトの読み込み確認
(function() {
  var checks = [
    ['React', typeof React],
    ['ReactDOM', typeof ReactDOM],
    ['Babel', typeof Babel],
    ['Firebase', typeof firebase]
  ];
  var missing = checks.filter(function(c){return c[1]==='undefined';}).map(function(c){return c[0];});
  
  // 2秒後にrootが空だったら診断結果を表示
  setTimeout(function() {
    var root = document.getElementById('root');
    if (!root || root.innerHTML.trim() === '') {
      var msg = missing.length > 0
        ? 'CDN未読み込み: ' + missing.join(', ')
        : '全CDN読み込み済み → Babel解析エラーの可能性';
      root.innerHTML = '<div style="padding:20px;background:white;color:red;font-family:monospace">' +
        '<b>ページが表示されませんでした</b><br><br>' + msg + '<br><br>' +
        checks.map(function(c){return c[0]+': '+(c[1]==='
