// ─── EMAILJS HELPERS ─────────────────────────────────────────────────────────
function getEjsCfg() {
  return {
    publicKey:  localStorage.getItem('ejs_pubkey')   || '',
    serviceId:  localStorage.getItem('ejs_service')  || '',
    templateId: localStorage.getItem('ejs_template') || '',
    adminEmail: localStorage.getItem('ejs_admin_email') || '',
    allEmail:   localStorage.getItem('ejs_all_email')   || '',
  };
}
function notifOn(key) { return localStorage.getItem('notif_' + key) !== 'false'; }

async function sendMail({ to, subject, body, senderName, type }) {
  const cfg = getEjsCfg();
  if (!cfg.publicKey || !cfg.serviceId || !cfg.templateId || !to) {
    console.info('[mail] skipped (not configured):', subject);
    return { skipped: true };
  }
  emailjs.init({ publicKey: cfg.publicKey });
  return emailjs.send(cfg.serviceId, cfg.templateId, {
    to_email: to, subject, body,
    sender_name: senderName || '西ノ島町職員労働組合',
    notify_type: type || '',
    app_url: window.location.href,
  });
}

const SurveyAnswer = ({ survey, onBack, onSubmit }) => {
  const questions = [
    { id:1, type:'single_choice', text:survey.id===1?'定期大会に出席しますか？':'この組合活動は役立っていると思いますか？',
      options: survey.id===1 ? ['出席する','欠席する','未定'] : ['非常にそう思う','そう思う','どちらでもない','そう思わない','全くそう思わない'] },
    { id:2, type:'free_text', text:'ご意見・ご要望があればご記入ください（任意）' },
  ];
  const [step, setStep] = useState(0);
  const [answers, setAnswers] = useState({});
  const current = questions[step];
  const isLast = step === questions.length - 1;
  return (
    <div className="fade-in pb-24">
      <Header title={survey.title} onBack={onBack}/>
      <div className="px-4 pt-4">
        <div className="flex gap-1 mb-6">
          {questions.map((_,i) => <div key={i} className={`flex-1 h-1 rounded-full ${i<=step?'bg-blue-600':'bg-gray-200'}`}/>)}
        </div>
        <p className="text-xs text-gray-400 mb-1">質問 {step+1} / {questions.length}</p>
        <p className="font-bold text-gray-900 text-[15px] mb-5 leading-snug">{current.text}</p>
        {current.type==='single_choice' && (
          <div className="space-y-2">
            {current.options.map(o => (
              <button key={o} onClick={()=>setAnswers({...answers,[current.id]:o})}
                className={`w-full text-left px-4 py-3 rounded-xl border-2 text-sm transition-colors ${answers[current.id]===o?'border-blue-600 bg-blue-50 font-semibold':'border-gray-200'}`}>
                {o}
              </button>
            ))}
          </div>
        )}
        {current.type==='free_text' && (
          <textarea value={answers[current.id]||''} onChange={e=>setAnswers({...answers,[current.id]:e.target.value})}
            rows={5} placeholder="任意入力です" className="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm"/>
        )}
        <div className="flex gap-3 mt-6">
          {step > 0 && <button onClick={()=>setStep(s=>s-1)} className="flex-1 py-3 border border-gray-300 rounded-xl text-sm font-medium">戻る</button>}
          {!isLast
            ? <button onClick={()=>setStep(s=>s+1)} disabled={current.type==='single_choice'&&!answers[current.id]}
                className="flex-1 py-3 bg-blue-700 text-white rounded-xl text-sm font-bold disabled:opacity-40">次へ</button>
            : <button onClick={()=>onSubmit(answers)}
                className="flex-1 py-3 bg-green-600 text-white rounded-xl text-sm font-bold">回答を送信</button>}
        </div>
      </div>
    </div>
  );
};

          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="キーワードで検索..."
            className="w-full pl-9 pr-3 py-2 bg-gray-100 rounded-lg text-sm"/>
        </div>
        <div className="flex gap-1.5 overflow-x-auto pb-1">
          <button onClick={()=>setCatFilter('')} className={`px-3 py-1 rounded-full text-xs font-medium whitespace-nowrap ${!catFilter?'bg-blue-700 text-white':'bg-gray-100 text-gray-600'}`}>すべて</button>
          {cats.map(c=>(
            <button key={c} onClick={()=>setCatFilter(c)} className={`px-3 py-1 rounded-full text-xs font-medium whitespace-nowrap ${catFilter===c?'bg-blue-700 text-white':'bg-gray-100 text-gray-600'}`}>{c}</button>
          ))}
        </div>
      </div>
      <div className="px-4 pt-3 space-y-2">
        {filtered.map(f => (
          <div key={f.id} className="bg-white border border-gray-100 rounded-xl overflow-hidden">
            <button onClick={()=>setOpen(open===f.id?null:f.id)} className="w-full text-left px-4 py-3 flex items-start gap-3">
              <span className="text-blue-600 font-bold flex-shrink-0 mt-0.5">Q</span>
              <div className="flex-1">
                <p className="text-[10px] text-gray-400 mb-0.5">{f.category}</p>
                <p className="text-sm font-medium text-gray-900">{f.q}</p>
              </div>
              <Icon name="chevron" size={16} color="#9ca3af"/>
            </button>
            {open===f.id && (
              <div className="px-4 pb-4 pt-1 border-t border-gray-100 bg-blue-50">
                <div className="flex gap-3">
                  <span className="text-teal-600 font-bold flex-shrink-0">A</span>
                  <p className="text-sm text-gray-700 leading-relaxed">{f.a}</p>
                </div>
              </div>
            )}
          </div>
        ))}
        {filtered.length===0 && <p className="text-center text-gray-400 text-sm py-8">該当するFAQが見つかりません</p>}
      </div>
    </div>
  );
};

const NotificationSettings = ({ onBack }) => {

    service:   localStorage.getItem('ejs_service')     || '',

    newSurvey:   localStorage.getItem('notif_newSurvey')  !== 'false',
    anonConsult: localStorage.getItem('notif_anonConsult')!== 'false',

  const save = () => {
    localStorage.setItem('ejs_pubkey',      cfg.pubkey);
    localStorage.setItem('ejs_service',     cfg.service);
    localStorage.setItem('ejs_template',    cfg.template);
    localStorage.setItem('ejs_admin_email', cfg.adminMail);
    localStorage.setItem('ejs_all_email',   cfg.allMail);
    Object.entries(notifs).forEach(([k,v]) => localStorage.setItem('notif_'+k, String(v)));

  const testSend = async () => {

    }

      await sendMail({

        {hint && <span className="text-[10px] text-gray-400">{hint}</span>}

      <input value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder}
        className={`w-full border border-gray-300 rounded-lg px-3 py-2 text-sm ${mono?'font-mono':''}`}/>
    </div>
  );

  return (
    <div className="fade-in pb-24">
      <Header title="メール通知設定" onBack={onBack}/>
      <div className="px-4 pt-4 space-y-5">

        {/* 説明 */}

          <p className="text-sm font-bold text-blue-800 mb-1">📧 EmailJS を使ったメール通知</p>
          <p className="text-xs text-blue-700">
            サーバー不要でブラウザから直接メール送信できます。
            <a href="https://www.emailjs.com" target="_blank" rel="noreferrer" className="underline font-medium"> emailjs.com </a>
            で無料アカウント（月200通）を作成し、以下に設定してください。
          </p>
        </div>

        {/* EmailJS 認証情報 */}
        <div>
          <p className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">EmailJS 認証情報</p>
          <div className="bg-white rounded-xl border border-gray-200 divide-y divide-gray-100">
            <Field label="Public Key"  hint="Account › General"       value={cfg.pubkey}   onChange={v=>setCfg({...cfg,pubkey:v})}   placeholder="xxxxxxxxxxxxxxxxxxxxxxx" mono/>
            <Field label="Service ID"  hint="Email Services"           value={cfg.service}  onChange={v=>setCfg({...cfg,service:v})}  placeholder="service_xxxxxxx" mono/>

            <div className="px-4 py-3">
              <p className="text-sm font-medium text-gray-700 mb-0.5">管理者（執行部）宛</p>
              <p className="text-xs text-gray-400 mb-1.5">匿名相談・予約受信の通知先</p>
              <input type="email" value={cfg.adminMail} onChange={e=>setCfg({...cfg,adminMail:e.target.value})}

          <div className="bg-gray-100 px-4 py-2">
            <p className="text-xs font-bold text-gray-600">EmailJS セットアップ手順</p>

const App = () => {
  const [user, setUser] = useState(null);
  const [tab, setTab] = useState('home');
  const [boardView, setBoardView] = useState('list');
  const [selectedPost, setSelectedPost] = useState(null);
  const [surveyView, setSurveyView] = useState('list');
  const [selectedSurvey, setSelectedSurvey] = useState(null);
  const [consultView, setConsultView] = useState('top');
  const [showNotifSettings, setShowNotifSettings] = useState(false);
  const [posts, setPosts] = useState(SAMPLE_POSTS);
  const [surveys, setSurveys] = useState(SAMPLE_SURVEYS);
  const [toast, setToast] = useState(null);

  const showToast = msg => setToast(msg);

  const handleNav = (t, item=null) => {
    setTab(t); setShowNotifSettings(false);
    if (t==='board')   { setBoardView(item?'detail':'list'); setSelectedPost(item); }
    if (t==='survey')  { setSurveyView(item?'answer':'list'); setSelectedSurvey(item); }
    if (t==='consult') { setConsultView('top'); }
  };

  const markRead = id => setPosts(ps => ps.map(p => p.id===id ? {...p,isRead:true,readCount:p.isRead?p.readCount:p.readCount+1} : p));

  const addPost = async (form) => {
    const np = { id:posts.length+1, ...form, authorName:user.name,
      publishedAt:new Date().toISOString().slice(0,10), readCount:0, totalCount:58, isRead:true, attachments:[] };
    setPosts(ps => [np, ...ps]);
    setBoardView('list');
    showToast('記事を公開しました');
    if (notifOn('newPost') && getEjsCfg().allEmail) {
      const catLabel = (CATEGORY_MAP[form.category]||{}).label || '';
      sendMail({ type:'newPost', to:getEjsCfg().allEmail,
        subject:`【組合お知らせ】${form.title}`,
        body:`西ノ島町職員労働組合より新しいお知らせが届きました。\n\n${catLabel}：${form.title}\n\n${form.body.slice(0,200)}\n\nポータルサイトからご確認ください。`,
        senderName:`${user.name}（西ノ島町職員労働組合）`,
      }).then(()=>showToast('メール通知を送信しました')).catch(e=>console.warn(e));
    }
  };

  const submitSurvey = () => {
    setSurveys(ss => ss.map(s => s.id===selectedSurvey.id ? {...s,isAnswered:true,answerCount:s.answerCount+1} : s));
    setSurveyView('list');
    showToast('回答を送信しました');
  };

  const handleAnonSubmit = (category) => {
    setConsultView('top');
    showToast('送信しました。確認コードを控えてください');
    if (notifOn('anonConsult') && getEjsCfg().adminEmail) {
      sendMail({ type:'anonConsult', to:getEjsCfg().adminEmail,
        subject:`【要対応】匿名相談が届きました（${category}）`,
        body:`匿名相談が1件届いています。\n\nカテゴリ：${category}\n受信日時：${new Date().toLocaleString('ja-JP')}\n\n管理者画面から内容を確認し対応をお願いします。\n（相談者の個人情報は記録されていません）`,
        senderName:'西ノ島町職員組合ポータル（自動送信）',
      }).catch(e=>console.warn(e));
    }
  };

  const handleReserveSubmit = (form) => {
    setConsultView('top');
    showToast('予約を受け付けました');
    if (notifOn('reservation') && getEjsCfg().adminEmail) {
      sendMail({ type:'reservation', to:getEjsCfg().adminEmail,
        subject:`【要確認】相談予約が届きました`,
        body:`相談予約が1件届いています。\n\n方法：${form.type==='face'?'面談':'電話相談'}\n希望日時：${form.date} ${form.time}\n相談種別：${form.topic||'未回答'}\n\n管理者画面から日程を確定してください。`,
        senderName:'西ノ島町職員組合ポータル（自動送信）',
      }).catch(e=>console.warn(e));
    }
  };

  const unreads = {
    board:  posts.filter(p=>!p.isRead).length,
    survey: surveys.filter(s=>s.status==='active'&&!s.isAnswered).length,
  };

  if (!user) return <LoginScreen onLogin={setUser}/>;

  const renderContent = () => {
    if (showNotifSettings) return <NotificationSettings onBack={()=>setShowNotifSettings(false)}/>;
    if (tab==='home') return <Dashboard posts={posts} surveys={surveys} onNav={handleNav} user={user}/>;
    if (tab==='board') {
      if (boardView==='new')    return <PostForm onBack={()=>setBoardView('list')} onSubmit={addPost}/>;
      if (boardView==='detail') return <BoardDetail post={selectedPost} onBack={()=>setBoardView('list')} onMarkRead={markRead} isAdmin={user.role==='admin'}/>;
      return <BoardList posts={posts} onSelect={p=>{setSelectedPost(p);setBoardView('detail');}} isAdmin={user.role==='admin'} onNew={()=>setBoardView('new')}/>;
    }
    if (tab==='survey') {
      if (surveyView==='answer' && selectedSurvey && !selectedSurvey.isAnswered)
        return <SurveyAnswer survey={selectedSurvey} onBack={()=>setSurveyView('list')} onSubmit={submitSurvey}/>;
      return <SurveyList surveys={surveys} onSelect={s=>{setSelectedSurvey(s);setSurveyView('answer');}}/>;
    }
    if (tab==='consult') {
      if (consultView==='anon')    return <AnonConsult   onBack={()=>setConsultView('top')} onSubmit={handleAnonSubmit}/>;
      if (consultView==='faq')     return <FAQScreen     onBack={()=>setConsultView('top')}/>;
      if (consultView==='reserve') return <ReserveScreen onBack={()=>setConsultView('top')} onSubmit={handleReserveSubmit}/>;
      return <ConsultTop onSelect={v=>setConsultView(v)}/>;
    }
    if (tab==='menu') return <MenuScreen user={user} onLogout={()=>setUser(null)} onNotifSettings={()=>setShowNotifSettings(true)}/>;
    return null;
  };

  return (
    <div className="max-w-[480px] mx-auto min-h-screen bg-gray-50">
      {renderContent()}
      {!showNotifSettings && <BottomNav active={tab} onChange={t=>{setTab(t);setBoardView('list');setSurveyView('list');setConsultView('top');setShowNotifSettings(false);}} unreads={unreads}/>}
      {toast && <Toast msg={toast} onClose={()=>setToast(null)}/>}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
